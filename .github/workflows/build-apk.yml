name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # Optional repo Variables (Settings > Secrets and variables > Actions > Variables).
  # Leave empty to build with Google TEST ads.
  ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
  VITE_ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
  VITE_ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
  VITE_BANNER_POSITION: ${{ vars.BANNER_POSITION }}
  # Meta Audience Network (optional). Set AD_PROVIDER to 'meta' to use it.
  VITE_AD_PROVIDER: ${{ vars.AD_PROVIDER }}
  VITE_META_BANNER_ID: ${{ vars.META_BANNER_ID }}
  VITE_META_INTERSTITIAL_ID: ${{ vars.META_INTERSTITIAL_ID }}
  VITE_META_TEST: ${{ vars.META_TEST }}
  VERSION_CODE: ${{ github.run_number }}
  HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generate app icon and splash
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#020617' --splashBackgroundColor '#020617'

      - name: Patch Android project (ads, SDKs, version)
        run: python3 scripts/patch-android.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VelocityTouch-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ---- Signed release (only runs if you added the signing secrets) ----
      - name: Build release APK and AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign release APK and AAB
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=android/app/build/outputs
          mkdir -p signed
          "$BT/zipalign" -f -p 4 "$OUT/apk/release/app-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out signed/VelocityTouch-release.apk "$RUNNER_TEMP/aligned.apk"
          cp "$OUT/bundle/release/app-release.aab" signed/VelocityTouch-release.aab
          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" signed/VelocityTouch-release.aab "$KEY_ALIAS"

      - name: Upload signed release
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VelocityTouch-release-signed
          path: signed/*
